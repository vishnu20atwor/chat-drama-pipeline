name: daily story

on:
  schedule:
    # 20:00 UTC = 4 PM ET / 1 PM PT, the after-school scroll. GitHub runs cron
    # late under load — read this as "within the hour".
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Sheet row to build (YYYY-MM-DD). Blank = today.'
        required: false
      privacy:
        description: 'public | unlisted | private'
        required: false
        default: public

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pick the date
        id: d
        run: echo "date=${{ inputs.date || '' }}" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: pip install edge-tts

      # Headless Chrome's shared libraries, plus the colour emoji font — without
      # it every emoji in every bubble renders as a hollow box.
      - name: Chrome libraries and emoji font
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64 fonts-noto-color-emoji

      - name: Sheet, voices, render
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          # Minecraft parkour gameplay, published for free commercial reuse by
          # automatesocials.com. Not a secret, so it sits here in the open where
          # it can be read and changed. 10m32s, so each day starts at a
          # different second and nothing repeats for over a year.
          BG_URL: https://automatesocials.com/wp-content/uploads/2024/02/12-Minecraft-Parkour-Gameplay.zip
          ELEVENLABS_KEY_1: ${{ secrets.ELEVENLABS_KEY_1 }}
          ELEVENLABS_KEY_2: ${{ secrets.ELEVENLABS_KEY_2 }}
        run: node scripts/build.mjs ${{ steps.d.outputs.date }}

      - name: Upload to YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PRIVACY: ${{ inputs.privacy || vars.PRIVACY || 'public' }}
        run: node scripts/upload.mjs ${{ steps.d.outputs.date }}

      - name: Send to phone
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: node scripts/deliver.mjs ${{ steps.d.outputs.date }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: story-${{ steps.d.outputs.date || 'today' }}
          path: |
            out/*.mp4
            out/*.cover.jpg
            out/*.post.txt
            out/*.meta.json
          retention-days: 14
